<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>教學進度追蹤</title>
<meta name="theme-color" content="#1E2A31">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{
  --paper:#FCFBF7; --card:#FFFFFF; --ink:#1E2A31; --soft:#5C6B73; --faint:#8B979D;
  --rule:#DFE5E4; --line:#EEF1F0;
  --ok:#1F7A5A; --warn:#C08A2E; --bad:#A32E28; --info:#2B5F7C;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"PingFang TC","Hiragino Sans TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}

/* header */
header{
  position:sticky; top:0; z-index:30; background:var(--paper);
  border-bottom:1px solid var(--rule); padding:env(safe-area-inset-top) 0 0;
}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 16px 8px;max-width:1200px;margin:0 auto}
.brand{font-size:17px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-size:11.5px;font-weight:400;color:var(--faint);letter-spacing:.06em}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;background:#C8CFCE;flex:none}
.dot.on{background:var(--ok)} .dot.err{background:var(--bad)} .dot.busy{background:var(--warn)}
.iconbtn{background:none;border:1px solid var(--rule);border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--soft)}
.iconbtn:hover{border-color:var(--ink);color:var(--ink)}
nav{display:flex;gap:2px;padding:0 10px 0;max-width:1200px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 9px;
  color:var(--soft);cursor:pointer;white-space:nowrap;font-size:14.5px
}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

main{max-width:1200px;margin:0 auto;padding:16px 16px 80px}
h2.sec{font-size:15px;margin:22px 0 10px;color:var(--soft);font-weight:600;letter-spacing:.04em}
h2.sec:first-child{margin-top:4px}

.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.card+.card{margin-top:10px}
.empty{color:var(--faint);padding:26px 16px;text-align:center;border:1px dashed var(--rule);border-radius:var(--r)}

/* lesson row */
.lesson{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.lesson:first-child{border-top:0}
.lesson.today{background:#FFFCF2}
.lmark{flex:none;width:4px;align-self:stretch;border-radius:2px;background:var(--rule)}
.lmeta{flex:none;width:74px;font-size:12.5px;color:var(--soft);line-height:1.45}
.lmeta b{display:block;font-size:14px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.lbody{flex:1;min-width:0}
.ltitle{font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.lactual{margin-top:5px;font-size:13.5px;color:var(--ok);white-space:pre-wrap}
.lnote{margin-top:4px;font-size:13px;color:var(--warn);white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--rule);color:var(--soft);background:#FAFBFB}
.tag.est{border-color:#E6D6AE;background:#FDF7E8;color:#8A6A1E}
.tag.test{border-color:#E8C9C6;background:#FBEFEE;color:var(--bad)}
.tag.hw{border-color:#C9DDD5;background:#EFF6F3;color:var(--ok)}
.lact{flex:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.st{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--rule);background:#fff;cursor:pointer;white-space:nowrap}
.st.done{background:#EAF5F0;border-color:#B6D9C9;color:var(--ok);font-weight:600}
.st.part{background:#FDF7E8;border-color:#E6D6AE;color:#8A6A1E;font-weight:600}
.st.cancel{background:#FBEFEE;border-color:#E8C9C6;color:var(--bad);text-decoration:line-through;font-weight:600}
.edit{font-size:12px;color:var(--faint);background:none;border:0;cursor:pointer;padding:2px}
.edit:hover{color:var(--ink)}

/* class head */
.chead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#FBFCFC;border-bottom:1px solid var(--line)}
.cdot{width:10px;height:10px;border-radius:3px;flex:none}
.cname{font-weight:600}
.cstat{margin-left:auto;display:flex;gap:14px;font-size:12.5px;color:var(--soft);text-align:right}
.cstat b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px}

.pill{font-size:12.5px;padding:2px 10px;border-radius:20px;font-weight:600}
.pill.ahead{background:#EAF5F0;color:var(--ok)}
.pill.on{background:#F1F3F3;color:var(--soft)}
.pill.behind{background:#FBEFEE;color:var(--bad)}

/* filters */
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar2 select,.bar2 input[type=search]{
  padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:#fff
}
.chip{padding:5px 12px;border:1px solid var(--rule);border-radius:20px;background:#fff;cursor:pointer;font-size:13.5px;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* overview */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.kpi h3{margin:0 0 2px;font-size:14px;display:flex;align-items:center;gap:8px}
.kpi .num{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .sub{font-size:12.5px;color:var(--faint)}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
table.cmp th,table.cmp td{padding:9px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
table.cmp th{color:var(--soft);font-weight:600;border-top:0;font-size:12.5px}
table.cmp td.n{text-align:right;font-variant-numeric:tabular-nums}

/* 代印 */
.pr-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
.pr-tbl th{padding:6px 6px;text-align:left;color:var(--soft);font-weight:600;font-size:12px;
           border-bottom:1px solid var(--rule);white-space:nowrap;background:#FBFCFC}
.pr-tbl td{padding:4px 5px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.pr-tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.pr-tbl th.n{text-align:center}
.pr-tbl input,.pr-tbl select{width:100%;padding:5px 6px;border:1px solid var(--rule);border-radius:6px;background:#fff;font-size:13px}
.pr-tbl input[type=number]{width:56px;text-align:right}
.pr-tbl input[type=date]{width:120px}
.pr-tbl tr.pr-new td{background:#FBFCFC}
.pr-tbl .cdot{width:8px;height:8px;border-radius:50%;margin-right:5px}

/* todo */
.todo{display:flex;gap:11px;padding:11px 14px;border-top:1px solid var(--line);align-items:flex-start}
.todo:first-child{border-top:0}
.todo input[type=checkbox]{width:19px;height:19px;margin-top:2px;flex:none;accent-color:#1F7A5A}
.todo .tmain{flex:1;min-width:0}
.todo.done .tmain{color:var(--faint);text-decoration:line-through}
.tdate{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}


/* 月曆 */
.calbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.calbar .mlab{font-size:16px;font-weight:600;min-width:112px;font-variant-numeric:tabular-nums}

/* 檔案夾樣式分頁：總／各科合併／各班 */
.foldertabs{display:flex;align-items:flex-end;gap:0;overflow-x:auto;scrollbar-width:none;
            margin:0 0 12px;border-bottom:1px solid var(--rule)}
.foldertabs::-webkit-scrollbar{display:none}
.ftab{flex:none;padding:7px 12px 6px;font-size:13px;color:var(--soft);background:#EEF1F0;
      border:1px solid var(--rule);border-bottom:0;border-radius:8px 8px 0 0;cursor:pointer;
      white-space:nowrap;margin:3px -1px 0 0;position:relative}
.ftab[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;
      margin-top:0;padding-top:9px;border-bottom:1px solid var(--paper);z-index:2}
.ftab.grpmain{color:var(--faint)}
.ftab.grpmain[aria-pressed="true"]{color:var(--ink)}
.ftab.grpsub{border-top:2px solid var(--c,var(--rule))}
.fdiv{flex:none;width:10px}
.seg{display:inline-flex}
.seg .chip{border-radius:0}
.seg .chip:first-child{border-radius:20px 0 0 20px}
.seg .chip:last-child{border-radius:0 20px 20px 0;margin-left:-1px}
.calwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:var(--r)}
.cal{display:grid;grid-template-columns:repeat(5,minmax(124px,1fr)) 92px 92px;gap:1px;background:var(--rule);min-width:800px}
.cal .dowh:nth-child(6),.cal .dowh:nth-child(7){color:var(--faint)}
.cal .dowh{background:#F6F8F7;text-align:center;padding:6px 0;font-size:12px;color:var(--soft);letter-spacing:.12em}
.cal .day{background:#fff;min-height:120px;padding:5px 5px 7px;display:flex;flex-direction:column;gap:4px}
.cal .day.out{background:#FBFBFA}
.cal .day.today{background:#FFFDF5}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.dnum{display:flex;align-items:baseline;gap:6px;font-size:11px;color:var(--faint);cursor:pointer;user-select:none}
.dnum b{font-size:13px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.dnum .wk{margin-left:auto;font-size:10px}
.day.today .dnum b{color:var(--warn)}
.ev{font-size:10.5px;color:#7A5C10;background:#FAF3E3;border-radius:4px;padding:1px 5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 課節卡：上半原定、下半實際 */
.lz{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:0 6px 6px 0;background:#EEF1F0;overflow:hidden}
.lz-h{display:flex;align-items:center;gap:5px;padding:2px 4px 2px 6px;background:#E2E7E5;font-size:10.5px;color:var(--faint)}
.lz-h .nm{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lz-h .pd{white-space:nowrap}
.lz.lz-miss .lz-h{background:#FBEBD3}
.stg{margin-left:auto;display:flex;gap:2px}
.sb{width:19px;height:17px;border:1px solid var(--rule);background:#fff;cursor:pointer;
    font-size:11.5px;line-height:1;border-radius:4px;padding:0;color:var(--faint)}
.sb:hover{border-color:var(--soft)}
.sb-done.on{background:#1A7F37;border-color:#1A7F37;color:#fff}
.sb-part.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sb-cancel.on{background:var(--bad);border-color:var(--bad);color:#fff}
.lz-p{padding:3px 6px;font-size:11px;line-height:1.42;color:var(--soft);white-space:pre-wrap;cursor:text;font-style:italic}
.lz-a{padding:3px 6px 4px;font-size:11.5px;line-height:1.42;color:var(--ink);font-weight:600;white-space:pre-wrap;
      background:#fff;border-top:1px solid var(--rule);cursor:text;min-height:20px}
.lz-a.ph{color:#B9C2C0;font-size:12px;font-weight:400;line-height:1.1;padding:2px 6px 3px}
.lz:hover .lz-a.ph{color:var(--faint)}
.lz.st-done .lz-p{color:var(--faint)}
.lz.st-cancel{background:#FBEFEE}
.lz.st-cancel .lz-h{background:#F6DBD8}
.lz.st-cancel .lz-p{text-decoration:line-through;color:#B4534C}
textarea.inl{width:100%;border:1px solid var(--ink);border-radius:4px;font-size:11px;line-height:1.42;
             padding:2px 4px;resize:vertical;font-family:inherit;background:#fff}
.addlz{margin-top:auto;align-self:flex-start;font-size:10px;color:var(--faint);background:none;
       border:1px dashed var(--rule);border-radius:4px;padding:1px 5px;cursor:pointer}
.addlz:hover{color:var(--ink);border-color:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font-size:12px;color:var(--soft);align-items:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.legend em{font-style:normal;font-size:13px;width:14px;text-align:center}
.legend .sep{width:1px;height:14px;background:var(--rule);display:block}

/* modal */
.mask{position:fixed;inset:0;background:rgba(30,42,49,.45);display:none;z-index:60;align-items:flex-end;justify-content:center}
.mask.open{display:flex}
.modal{background:var(--card);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:640px){.mask{align-items:center}.modal{border-radius:14px}}
.modal h3{margin:0 0 4px;font-size:16px}
.modal .ref{color:var(--soft);font-size:13px;white-space:pre-wrap;background:#FAFBFB;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:8px 0 14px}
label.f{display:block;margin:12px 0 5px;font-size:13px;color:var(--soft)}
.modal textarea,.modal input[type=text],.modal input[type=password],.modal select{
  width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;background:#fff
}
.modal textarea{min-height:70px;resize:vertical}
.states{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.states button{padding:7px 13px;border:1px solid var(--rule);border-radius:20px;background:#fff;cursor:pointer;font-size:13.5px}
.states button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.mfoot{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;padding:11px;border-radius:9px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.danger{background:#fff;color:var(--bad);border-color:#E8C9C6}
.hintx{font-size:12.5px;color:var(--faint);margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
ol.steps{padding-left:20px} ol.steps li{margin:7px 0}
code{background:#F1F3F3;padding:1px 5px;border-radius:4px;font-size:13px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand">教學進度<small id="brandSub"></small></div>
    <div class="sync">
      <span class="dot" id="dot"></span><span id="syncTxt">未連線</span>
      <button class="iconbtn" id="btnSync" title="立即同步">同步</button>
      <button class="iconbtn" id="btnSet" title="設定">設定</button>
    </div>
  </div>
  <nav id="nav" role="tablist">
    <button role="tab" data-v="today" aria-selected="true">今日</button>
    <button role="tab" data-v="cal">月曆</button>
    <button role="tab" data-v="todo">測驗・功課</button>
    <button role="tab" data-v="print">代印</button>
    <button role="tab" data-v="overview">總覽對照</button>
  </nav>
</header>

<main id="view"></main>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="./app.js"></script>
</body>
</html>
